[package]
name = "shamell_bff_gateway"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "shamell_bff_auth_schema_migrate"
path = "src/bin/schema_migrate.rs"

[dependencies]
# Workspace-shared deps. Per-crate feature requirements are layered via
# `features = [...]` on top of the workspace base, which keeps the version
# in lockstep with every other crate.
axum = { workspace = true, features = ["multipart", "ws"] }
base64 = { workspace = true }
chrono = { workspace = true }
hmac = { workspace = true }
ipnet = { workspace = true }
jsonwebtoken = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
subtle = { workspace = true }
tokio = { workspace = true, features = ["signal"] }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Crate-local deps that no other workspace member needs (yet).
csv = "1"
futures-util = "0.3"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
urlencoding = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

shamell_common = { path = "../../crates_rs/shamell_common", version = "0.1.0" }

[lints]
workspace = true
