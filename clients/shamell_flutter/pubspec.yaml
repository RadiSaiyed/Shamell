name: shamell_flutter
description: Minimal client for alias linking and @alias transfers
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  intl: any
  flutter_localizations:
    sdk: flutter
  http: ^1.1.0
  path_provider: ^2.1.5
  qr: ^3.0.2
  shared_preferences: ^2.2.2
  mobile_scanner: ^7.1.4
  web_socket_channel: ^2.4.0
  geolocator: ^10.1.1
  webview_flutter: ^4.7.0
  qr_flutter: ^4.1.0
  app_links: ^6.4.1
  workmanager: ^0.9.0+3
  pinenacl: ^0.6.0
  crypto: ^3.0.7
  flutter_local_notifications: ^17.2.4
  google_fonts: ^6.3.3
  image_picker: ^1.0.7
  share_plus: ^10.1.4
  just_audio: ^0.9.46
  # Track this with Android KGP upgrades; see scripts/check_kotlin_webrtc_compat.sh.
  # Pinned to 1.3.0 to satisfy livekit_client's transitive dependency.
  flutter_webrtc: 1.3.0
  # LiveKit SFU client for voice/video calls. Brings its own bundled WebRTC
  # plumbing so we can drop manual SDP/ICE handling in voip_call_page.dart.
  livekit_client: ^2.5.0
  record: ^6.1.2
  audio_session: ^0.1.25
  proximity_sensor: ^1.3.9
  flutter_map: ^6.2.1
  latlong2: ^0.9.0
  geocoding: ^2.2.2
  url_launcher: ^6.3.2
  firebase_core: ^4.2.1
  firebase_messaging: ^16.0.4
  local_auth: ^3.0.0
  flutter_secure_storage: ^10.0.0
  flutter_slidable: ^3.1.2
  image_gallery_saver_plus: ^4.0.1
  maplibre_gl: ^0.25.0
  file_picker: ^8.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^3.0.2
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8
  share_plus_platform_interface: ^5.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/sfx/
    # Mini-games bundled into the APK as WebView assets. All games
    # load via the shared MiniGameWebViewPage host
    # (`lib/core/mini_games/mini_game_webview_page.dart`), which calls
    # WebViewController.loadFlutterAsset on
    # `assets/mini_games/<gameId>/index.html`. New mini-games drop
    # into `assets/mini_games/<gameId>/` and get a sibling line here.
    - assets/mini_games/jump_jump/
    - assets/mini_games/tic_tac_toe/
    # Mini-apps (non-game HTML5 mini-programs) follow the same pattern
    # under `assets/mini_apps/<app_id>/`. Hotels is the first entry —
    # see `lib/core/mini_apps/hotels_mini_app_page.dart`.
    - assets/mini_apps/hotels/

flutter_icons:
  android: true
  ios: false
  image_path: ../../SyrChat_Icon.png
  adaptive_icon_background: "#111827"
  adaptive_icon_foreground: ../../SyrChat_Icon.png
