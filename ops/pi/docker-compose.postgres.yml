      context: ../..
      dockerfile: services_rs/chat_service/Dockerfile
    image: shamell-chat-rs:pi
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    environment:
      ENV: "${ENV:-prod}"
      APP_HOST: "0.0.0.0"
      APP_PORT: "8081"
      CHAT_DB_URL: "${CHAT_DB_URL:?set CHAT_DB_URL (postgres) in ops/pi/.env}"
