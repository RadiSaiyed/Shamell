      AUTH_CHAT_REGISTER_MAX_PER_DEVICE: "${AUTH_CHAT_REGISTER_MAX_PER_DEVICE:-20}"
      AUTH_CHAT_GET_DEVICE_WINDOW_SECS: "${AUTH_CHAT_GET_DEVICE_WINDOW_SECS:-300}"
