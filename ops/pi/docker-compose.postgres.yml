      - "${BFF_PUBLISH_ADDR:-127.0.0.1}:${BFF_PUBLISH_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      chat:
        condition: service_healthy
      payments:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-H", "Host: bff", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  chat:
