      AUTH_PAYMENT_MUTATION_ATTESTATION_EMERGENCY_BYPASS_OPERATIONS: "${AUTH_PAYMENT_MUTATION_ATTESTATION_EMERGENCY_BYPASS_OPERATIONS:-}"
      AUTH_BIOMETRIC_ENROLL_HARDWARE_ATTESTATION_ENABLED: "${AUTH_BIOMETRIC_ENROLL_HARDWARE_ATTESTATION_ENABLED:-false}"
      AUTH_BIOMETRIC_ENROLL_HARDWARE_ATTESTATION_TTL_SECS: "${AUTH_BIOMETRIC_ENROLL_HARDWARE_ATTESTATION_TTL_SECS:-120}"
      AUTH_BIOMETRIC_LOGIN_HARDWARE_ATTESTATION_ENABLED: "${AUTH_BIOMETRIC_LOGIN_HARDWARE_ATTESTATION_ENABLED:-false}"
      AUTH_BIOMETRIC_LOGIN_HARDWARE_ATTESTATION_TTL_SECS: "${AUTH_BIOMETRIC_LOGIN_HARDWARE_ATTESTATION_TTL_SECS:-120}"
