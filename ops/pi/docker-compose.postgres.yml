      CHAT_INTERNAL_SECRET: "${CHAT_INTERNAL_SECRET:-}"
      BFF_REQUIRE_INTERNAL_SECRET: "${BFF_REQUIRE_INTERNAL_SECRET:-true}"
      BFF_ENFORCE_ROUTE_AUTHZ: "${BFF_ENFORCE_ROUTE_AUTHZ:-true}"
