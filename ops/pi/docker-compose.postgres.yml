services:
  db:
    image: postgres:16-alpine@sha256:97ff59a4e30e08d1c11bdcd9455e7832368c0572b576c9092cde2df4ae5552a3
    init: true
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?set POSTGRES_USER in ops/pi/.env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in ops/pi/.env}"
      POSTGRES_DB: "${POSTGRES_DB:-postgres}"
      POSTGRES_DB_CORE: "${POSTGRES_DB_CORE:-shamell_core}"
      POSTGRES_DB_CHAT: "${POSTGRES_DB_CHAT:-shamell_chat}"
      POSTGRES_DB_PAYMENTS: "${POSTGRES_DB_PAYMENTS:-shamell_payments}"
      POSTGRES_DB_REGULATORY: "${POSTGRES_DB_REGULATORY:-regulator_reporting}"
    ports:
      - "${POSTGRES_PUBLISH_ADDR:-127.0.0.1}:${POSTGRES_PUBLISH_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  bff:
    build:
      context: ../..
      dockerfile: services_rs/bff_gateway/Dockerfile
    image: shamell-bff-rs:pi
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    environment:
      ENV: "${ENV:-prod}"
      SHAMELL_DEPLOYMENT_PROFILE: "${SHAMELL_DEPLOYMENT_PROFILE:-ops-pi}"
      APP_HOST: "0.0.0.0"
      APP_PORT: "8080"
      DB_URL: "${DB_URL:?set DB_URL (postgres) in ops/pi/.env}"
      AUTH_AUTO_APPLY_SCHEMA: "${AUTH_AUTO_APPLY_SCHEMA:-false}"
      INTERNAL_API_SECRET: "${INTERNAL_API_SECRET:?set INTERNAL_API_SECRET in ops/pi/.env}"
      BFF_SECURITY_ALERT_ALLOWED_CALLERS: "${BFF_SECURITY_ALERT_ALLOWED_CALLERS:-security-reporter}"
      BFF_ACCESS_ASSIGNMENT_ALLOWED_CALLERS: "${BFF_ACCESS_ASSIGNMENT_ALLOWED_CALLERS:-}"
      BFF_ACCESS_ASSIGNMENT_INTERNAL_IDENTITY_PUBLIC_KEYS: "${BFF_ACCESS_ASSIGNMENT_INTERNAL_IDENTITY_PUBLIC_KEYS:-}"
      BFF_ACCESS_ASSIGNMENT_INTERNAL_IDENTITY_MAX_SKEW_SECS: "${BFF_ACCESS_ASSIGNMENT_INTERNAL_IDENTITY_MAX_SKEW_SECS:-30}"
      BFF_ACCESS_ASSIGNMENT_REQUIRE_INTERNAL_IDENTITY_V2: "${BFF_ACCESS_ASSIGNMENT_REQUIRE_INTERNAL_IDENTITY_V2:-true}"
