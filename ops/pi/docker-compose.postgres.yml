    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:v1.5.2@sha256:fb032a59b5d926efae328ba46e54fba69cce5bd09cd4c8ed64d0302f6ed9c6cf
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    command: ["--config", "/etc/livekit/livekit.yaml"]
    environment:
      LIVEKIT_KEYS: "{${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in ops/pi/.env}: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in ops/pi/.env}${LIVEKIT_KEYS_EXTRA:-}}"
    volumes:
      - ./livekit:/etc/livekit:ro
    ports:
      - "${LIVEKIT_HTTP_PUBLISH_ADDR:-127.0.0.1}:${LIVEKIT_HTTP_PORT:-7880}:7880"
      # Best-practice default on the API host: keep RTC ports local.
      # Run public LiveKit RTC on a dedicated host (see ops/livekit).
      - "${LIVEKIT_RTC_PUBLISH_ADDR:-127.0.0.1}:${LIVEKIT_TCP_PORT:-7881}:7881"
      - "${LIVEKIT_RTC_PUBLISH_ADDR:-127.0.0.1}:${LIVEKIT_UDP_PORT:-7882}:7882/udp"
    restart: unless-stopped

  coturn:
    image: coturn/coturn:4.6.2-r2
    init: true
    network_mode: host
    security_opt:
      - no-new-privileges:true
    command:
      - -n
      - --fingerprint
      - --lt-cred-mech
      - --realm=${TURN_REALM:-shamell.online}
      - --user=${TURN_USERNAME:?set TURN_USERNAME in ops/pi/.env}:${TURN_PASSWORD:?set TURN_PASSWORD in ops/pi/.env}
      - --listening-port=${TURN_LISTEN_PORT:-3478}
      - --listening-ip=${TURN_EXTERNAL_IP:?set TURN_EXTERNAL_IP in ops/pi/.env}
      - --relay-ip=${TURN_EXTERNAL_IP:?set TURN_EXTERNAL_IP in ops/pi/.env}
      - --external-ip=${TURN_EXTERNAL_IP:?set TURN_EXTERNAL_IP in ops/pi/.env}
      - --min-port=${TURN_RELAY_MIN_PORT:-49160}
      - --max-port=${TURN_RELAY_MAX_PORT:-49200}
      - --no-cli
      - --no-tls
      - --no-dtls
      - --log-file=stdout
    restart: unless-stopped

volumes:
  postgres_data:
