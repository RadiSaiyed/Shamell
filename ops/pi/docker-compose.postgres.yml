      BFF_SECURITY_ALERT_INTERNAL_IDENTITY_MAX_SKEW_SECS: "${BFF_SECURITY_ALERT_INTERNAL_IDENTITY_MAX_SKEW_SECS:-30}"
      BFF_SECURITY_ALERT_REQUIRE_INTERNAL_IDENTITY_V2: "${BFF_SECURITY_ALERT_REQUIRE_INTERNAL_IDENTITY_V2:-true}"
      BFF_SECURITY_ALERT_ALLOW_LEGACY_INTERNAL_SECRET_FALLBACK: "${BFF_SECURITY_ALERT_ALLOW_LEGACY_INTERNAL_SECRET_FALLBACK:-false}"
      BFF_INTERNAL_SERVICE_ID: "${BFF_INTERNAL_SERVICE_ID:-bff}"
      BFF_INTERNAL_IDENTITY_SIGNING_SEED_B64: "${BFF_INTERNAL_IDENTITY_SIGNING_SEED_B64:?set BFF_INTERNAL_IDENTITY_SIGNING_SEED_B64 in ops/pi/.env}"
