      AUTH_WEB_DIRECT_ACCESS_ACCOUNT_ID: "${AUTH_WEB_DIRECT_ACCESS_ACCOUNT_ID:-}"
      AUTH_WEB_DIRECT_ACCESS_PHONE: "${AUTH_WEB_DIRECT_ACCESS_PHONE:-}"
      AUTH_WEB_DIRECT_ACCESS_DEVICE_ID: "${AUTH_WEB_DIRECT_ACCESS_DEVICE_ID:-}"
      AUTH_WEB_DIRECT_LAUNCH_SIGNING_SECRET: "${AUTH_WEB_DIRECT_LAUNCH_SIGNING_SECRET:-}"
