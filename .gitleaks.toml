title = "Shamell gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Repo-wide allowlist for known false-positive matches."
commits = [
  # Deterministic CocoaPods lockfile checksum false positive (legacy).
  "c2f3e5f09b8e0c908bcac994d24668ccfddc87d3",
]
paths = [
  # CocoaPods lockfile contains hex hashes that look like generic secrets.
  '''clients/shamell_flutter/ios/Podfile\.lock''',
  # Per-flavor Firebase mobile client configs (google-services.json) ship
  # their public Firebase API keys; these are public-by-design identifiers
  # for the Firebase project, not secrets. Admin-SDK service-account keys
  # are blocked separately by .gitignore.
  '''google-services/google-services\.json''',
  '''clients/shamell_flutter/android/app/.*google-services\.json''',
]
regexTarget = "line"
regexes = [
  # CocoaPods lockfile entry that gitleaks flags as a generic API key.
  '''local_auth_darwin:\s*[a-f0-9]{40}''',
  # Test fixtures in `#[cfg(test)] mod` sections of bff_gateway::config
  # and in scripts/check_ops_*.sh ENV preflight fixtures. These strings
  # are intentionally short, recognisable placeholder values that exist
  # only to drive negative-path tests / preflight assertions; they never
  # see production. Patterns are tight enough to never match real
  # secrets generated by `openssl rand` etc.
  '''(?i)(bff|edge|internal|api|test|dev|fake|mock|chat|pay|payments|auth|admin|iam|workforce)-secret-[0-9]{4,32}''',
  '''(?i)(secret|password|key)[0-9]{2,6}\b''',
  '''pubkey[0-9]+\b''',
]
